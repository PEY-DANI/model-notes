<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="회사, 대학원, 원티드 과정에서 사용한 모델을 과제별로 정리한 포트폴리오 페이지">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Model Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 모델 카탈로그(모델별 / 프로젝트별 전환 + 필터) → 모델 상세(#id) */
:root{
  --bg:#dbe9fd; --bg-grad:linear-gradient(180deg,#c3dbfb 0%,#e9f2fe 100%);
  --surface:rgba(255,255,255,.62); --fg:#0f2250; --muted:#263f6b; --line:rgba(60,100,180,.22);
  --accent:#3b82f6; --accent-ink:#123a94; --accent-soft:rgba(59,130,246,.14); --warn:#9a5b00; --warn-soft:rgba(251,239,217,.85);
  --c-co:#123a94; --c-co-soft:rgba(18,58,148,.12); --c-wt:#1d5fd0; --c-wt-soft:rgba(59,130,246,.18); --c-gr:#0b6a99; --c-gr-soft:rgba(14,165,233,.18);
  --code-bg:#14264d; --code-fg:#dbe7ff;
  --card-grad:linear-gradient(160deg,rgba(255,255,255,.78),rgba(214,229,253,.55));
  --hot-grad:linear-gradient(150deg,#2f6fe4 0%,#2a5fd0 55%,#244fb8 100%);
  --shadow:0 10px 30px -12px rgba(30,70,150,.35); --radius:22px;
  --font-body:"Manrope","IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0b1630; --bg-grad:linear-gradient(180deg,#0b1630 0%,#122550 100%);
  --surface:rgba(30,50,95,.55); --fg:#e4ecff; --muted:#93a8d4; --line:rgba(140,175,255,.18);
  --accent:#6aa2ff; --accent-ink:#8fb7ff; --accent-soft:rgba(106,162,255,.18); --warn:#f0b35a; --warn-soft:rgba(51,39,15,.8);
  --c-co:#8fb7ff; --c-co-soft:rgba(143,183,255,.16); --c-wt:#6aa2ff; --c-wt-soft:rgba(106,162,255,.2); --c-gr:#7fd3ff; --c-gr-soft:rgba(56,189,248,.18);
  --code-bg:#0a1228; --code-fg:#dbe7ff;
  --card-grad:linear-gradient(160deg,rgba(60,90,160,.4),rgba(25,45,95,.5));
  --hot-grad:linear-gradient(150deg,#2f6fe4 0%,#2563d8 60%,#1e4fb8 100%);
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg-grad) fixed,var(--bg);min-height:100vh;color:var(--fg);font:16px/1.7 var(--font-body);padding-inline:16px;padding-block:40px 72px;word-break:keep-all}
.wrap{max-width:1180px;margin-inline:auto}
.wrap.narrow{max-width:1000px}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.label{font:600 12px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.todo{color:var(--muted);font-style:italic}

.top h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:10px 0 10px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.top p{color:var(--muted);max-width:62ch;margin:0;font-size:16.5px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}
.stats span{font:500 14px var(--font-mono);color:var(--muted)}
.stats b{color:var(--fg);font-weight:700}
.themebtn{float:right;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer}

.tabs{display:inline-flex;gap:4px;margin-top:26px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;backdrop-filter:blur(10px)}
.tab{border:0;background:none;font-size:15px;padding:8px 20px;cursor:pointer;color:var(--muted);border-radius:99px;font-weight:600}
.tab[aria-selected="true"]{color:#fff;background:var(--hot-grad);box-shadow:0 4px 12px -4px rgba(47,111,228,.6)}

.filters{display:grid;gap:12px;margin-block:22px 20px}
.search{width:100%;padding:12px 16px;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;font:inherit;backdrop-filter:blur(10px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .label{margin-right:4px;min-width:48px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;backdrop-filter:blur(10px)}
.chip[aria-pressed="true"]{background:var(--hot-grad);border-color:transparent;color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#fff}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
[data-ctx="co"]{--c1:#d9f7ee;--c2:#c3e9f2}
[data-ctx="wt"]{--c1:#dde9ff;--c2:#d3d9fb}
[data-ctx="gr"]{--c1:#ebe2ff;--c2:#f2dcf6}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:285px;text-align:left;color:#12224a;background:linear-gradient(145deg,var(--c1,#dde9ff),var(--c2,#d3d9fb));border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:18px 20px;cursor:pointer;min-width:0;box-shadow:0 12px 28px -14px rgba(60,90,160,.4);transition:transform .25s,box-shadow .25s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.85),rgba(255,255,255,0) 55%);pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 20px 34px -14px rgba(60,90,160,.5)}
.card>*:not(.card-art){position:relative}
.card-art{position:absolute;opacity:.95;left:0;right:-6%;bottom:40px;height:50%;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 60% 68% at 64% 58%,#000 28%,rgba(0,0,0,.6) 52%,transparent 82%);mask-image:radial-gradient(ellipse 60% 68% at 64% 58%,#000 28%,rgba(0,0,0,.6) 52%,transparent 82%)}
.card-art svg{width:100%;height:100%;display:block}
.card .badges{gap:5px}
.card .badges .badge{background:rgba(255,255,255,.75);color:#1d3a8a;padding:4px 8px;font-size:11px}
.card h2{margin:0;color:#12224a;font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.015em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .desc{margin:0;font-size:13px;line-height:1.5;color:#3a4f7a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:94%}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:#2f6fe4;color:#fff;font:600 11.5px/1 var(--font-body);padding:8px 13px;border-radius:99px;max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:#2f6fe4;box-shadow:0 2px 8px -2px rgba(60,90,160,.35);display:grid;place-items:center;font-size:14px;font-weight:700;transition:transform .25s}
.card:hover .go{transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){.card,.go{transition:none}.card:hover{transform:none}}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;font:600 12px/1 var(--font-mono);letter-spacing:.03em;padding:6px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
.badge.co{background:var(--c-co-soft);color:var(--c-co)}
.badge.gr{background:var(--c-gr-soft);color:var(--c-gr)}
.badge.wt{background:var(--c-wt-soft);color:var(--c-wt)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:40px 0;color:var(--muted)}

/* project view */
/* 상세 화면 상단: 모델 카드와 같은 파란 카드 + 일러스트 */
.dhero{position:relative;overflow:hidden;color:#12224a;background:linear-gradient(145deg,var(--c1,#dde9ff),var(--c2,#d3d9fb));border:1px solid rgba(255,255,255,.9);border-radius:30px;padding:30px 32px;min-height:270px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;box-shadow:0 18px 40px -20px rgba(60,90,160,.4)}
.dhero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.85),rgba(255,255,255,0) 55%);pointer-events:none}
.dhero-art{position:absolute;right:-2%;top:4%;bottom:4%;width:52%;opacity:.95;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 62% 72% at 62% 55%,#000 30%,rgba(0,0,0,.6) 55%,transparent 85%);mask-image:radial-gradient(ellipse 62% 72% at 62% 55%,#000 30%,rgba(0,0,0,.6) 55%,transparent 85%)}
.dhero-art svg{width:100%;height:100%;display:block}
.dhero>*:not(.dhero-art){position:relative;max-width:58%}
.dhero h1{margin:0;color:#12224a;font-size:clamp(30px,5vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.dhero .sub{margin:0;color:#3a4f7a;font-size:16.5px}
.dhero .badge{background:rgba(255,255,255,.75);color:#1d3a8a}
@media (max-width:700px){.dhero>*:not(.dhero-art){max-width:none}.dhero-art{opacity:.35;width:85%}}
/* 프로젝트 카드: 연한 카드 */
.proj{position:relative;color:var(--fg);background:var(--card-grad);border:1px solid var(--line);border-radius:22px;padding:22px 26px;min-width:0;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.proj-body{max-width:78ch}
.proj h3{margin:0 0 6px;font-size:19px;line-height:1.3;font-weight:800;letter-spacing:-.01em}
.proj .pm{font:500 13px var(--font-mono);color:var(--muted);margin-bottom:10px}
.proj p{margin:0 0 14px}
.ptags{display:flex;gap:8px;flex-wrap:wrap}
.proj .pill{border:0;cursor:pointer;background:var(--accent-soft);color:var(--accent-ink);font:600 12.5px/1 var(--font-body);padding:8px 13px;max-width:none}
.proj .pill:hover,.proj .pill:focus-visible{background:var(--accent);color:#fff}

.pgroup{margin-top:30px}
.pgroup>h2{font-size:18px;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.plist{display:grid;gap:12px}

/* detail */
.back{border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);color:var(--accent-ink);cursor:pointer;padding:8px 16px;border-radius:99px;margin-bottom:18px;font-size:15px;font-weight:600}
.dhead h1{font-size:clamp(28px,5vw,40px);margin:12px 0 6px;line-height:1.15;letter-spacing:-.02em}
.dhead .sub{color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-block:24px}
.facts div{background:var(--card-grad);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px);padding:16px 18px;min-width:0}
.facts dt{margin:0 0 6px}
.facts dd{margin:0;font-size:15.5px}
section.sec{margin-block:20px 0;background:var(--card-grad);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
section.sec.bare{background:none;border:0;box-shadow:none;padding:0;backdrop-filter:none;margin-top:36px}
section.sec>h2{font-size:21px;margin:0 0 16px;font-weight:700;letter-spacing:-.01em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.two h3{font-size:15.5px;margin:0 0 8px;font-weight:700}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:6px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);padding:7px 14px;border-radius:99px;font-size:14px;color:var(--fg)}
.tag small{font:500 12px var(--font-mono);color:var(--muted)}
button.tag{cursor:pointer;border-color:var(--accent);color:var(--accent-ink);font-weight:500}
pre{background:var(--code-bg);color:var(--code-fg);padding:18px;border-radius:18px;overflow-x:auto;font:400 14px/1.65 var(--font-mono);margin:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);font:500 12px var(--font-mono);color:#fff;background:var(--hot-grad);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:2px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.log{display:grid;gap:16px}
.rec{background:var(--card-grad);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.rec-head{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.rec-head h3{margin:0;font-size:18px;font-weight:700}
.rec-head h3 button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.rec-head h3 button:hover{color:var(--accent-ink)}
.rec dl{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;margin:0}
.rec dt{font:600 12px/1.9 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rec dd{margin:0;min-width:0}
@media(max-width:560px){.rec dl{grid-template-columns:1fr;gap:2px}.rec dd{margin-bottom:10px}}
.mchips{display:flex;gap:8px;flex-wrap:wrap}
.mchip{display:inline-flex;gap:8px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:14px}
.mchip small{font:500 12px var(--font-mono);color:var(--muted)}
.mchip b{font:700 14px var(--font-mono)}
.note{font-size:14px;color:var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:14px;margin-top:12px}
.hint{margin:-4px 0 16px;font-size:14px;color:var(--muted)}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   데이터
   PROJECTS: 프로젝트 목록 (ctx: 회사 / 대학원 / 원티드)
   MODELS:   모델 카드. usage[].p 는 PROJECTS 의 id
   값이 null 이면 화면에 '작성 필요'로 표시됩니다.
   ============================================================ */
const CTX = {co:"Career", wt:"Bootcamp", gr:"Education"};
const PROJECTS = [
 {id:"mobis-ngios", ctx:"co", name:"현대모비스 서비스부품 글로벌 수요예측 시스템 (nGIOS)", org:"디에스이트레이드", period:"2022.03 – 2025.11", team:null,
  summary:"서비스부품 글로벌 수요예측 시스템의 예측 인자 발굴, 모델·로직 변경 검증, 데이터레이크 기반 예측 파이프라인 구축·운영. 단기·장기 예측을 시계열, ML, DL 3개 트랙으로 구성하고 품목별로 모델을 선정했다. 내수 예측 정확도 KPI 80% 달성에 기여했고, 시스템 전환 후 정확도 81.3%(내수 84.1%, 수출 77.6%)를 유지했다. 정확도 = 100 − SMAPE/2."},
 {id:"mobis-weather", ctx:"co", name:"기상 기반 후보정 복원·확장", org:"디에스이트레이드", period:"2024.07 – 2024.09", team:null,
  summary:"차세대 전환 때 누락된 기상 후보정 로직을 복원하고, 앞단 기상 예측 모델부터 개선했다. 법인 단위 보정을 창고 단위로 확장해 2,646개 부품 정확도를 가중평균 2.6%p(최대 5.78%p) 개선했다."},
 {id:"mobis-dealer", ctx:"co", name:"대리점 실수요 분석 및 재고 지표 도출", org:"디에스이트레이드", period:"2022", team:null,
  summary:"대리점 실수요·재고 데이터 207만 건에서 후보 변수 48개를 17개로 선별하고, 재고 지표를 본사 단기 모델의 입력 변수로 운영 반영했다."},
 {id:"mobis-transfer", ctx:"co", name:"연구팀 모델 운영 적용과 인수 기준 수립", org:"디에스이트레이드", period:"2024.08 – 2025", team:null,
  summary:"연구팀 모델을 PySpark·Airflow 운영 배치에 맞게 재설계해 첫 운영 반영을 만들고, 실측 기반 인수 기준으로 후속 모델의 설계를 바꿨다."},
 {id:"mirae-essay", ctx:"co", name:"자기소개서 평가 모델 개발", org:"미래기술", period:"2018.10 – 2019.01", team:null,
  summary:"협업 능력 항목의 평가 기준을 0·1·2점 클래스로 정량화해 훈련 데이터를 만들고 모델화했다. 인사 담당자 채점과 97% 이상 일치했고, 서류 평가 시간을 건당 3~5분에서 3초로 줄였다."},
 {id:"mirae-agri", ctx:"co", name:"농산물 유통 종합정보시스템 고도화", org:"미래기술", period:"2020.07 – 2021.02", team:null,
  summary:"6개 유통 플랫폼 데이터의 자동 수집·적재 파이프라인과 사전 기반 검색 시스템, 대시보드를 구축했다."},
 {id:"grad-gif", ctx:"gr", name:"G.I.F — Modular RAG 기반 기프티콘 이미지 검색 (Gifticon Image Finder)", org:"연세대 공학대학원", period:"2024.09 – 2024.12", team:"팀 4명",
  summary:"기프티콘 이미지를 읽어 검색하는 Modular RAG. 모듈 수 × 메트릭 수에 비례하는 평가 비용을 줄이기 위해 메트릭을 선별하고 모듈 단계별 고정 실험으로 최적 조합을 확정했다. 의미 유사도 0.85 → 0.88. AutoRAG로 평가를 자동화해 실험 시간을 12시간에서 15분으로 줄였다."},

  oneLine:"수요 크기와 수요 발생 간격을 따로 평활하는 간헐수요 예측법",
  source:{org:"J. D. Croston (1972)", paper:"Forecasting and stock control for intermittent demands"},
  purpose:"0이 많은 간헐수요 부품의 예측을 안정화한다.",
  features:["수요 크기와 발생 간격을 분리해 평활한다"], limits:["수요 발생 시점의 불확실성을 잘 표현하지 못한다","편향이 있다는 지적이 있어 변형(SBA 등)이 따로 있다"],

  code:"def croston(y, alpha=0.1):\n    z = p = None          # z: 수요 크기, p: 수요 발생 간격\n    q = 1                 # 마지막 수요 이후 경과 기간\n    forecast = []\n    for x in y:\n        if x > 0:\n            if z is None:\n                z, p = x, q\n            else:\n                z += alpha * (x - z)\n                p += alpha * (q - p)\n            q = 1\n        else:\n            q += 1\n        forecast.append(z / p if z else 0)\n    return forecast",

/* ---------- 카드 일러스트: SVG 조명 필터로 만든 3D 클레이 질감 (과제 유형별 모양) ---------- */
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function smooth(pts,closed){
  const n=pts.length,at=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  let d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(let i=0;i<(closed?n:n-1);i++){
    const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    d+="C"+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+" "+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+" "+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+" "+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+" "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return closed?d+"Z":d;
}

function lightFilter(id,blur,scale,shadow){
  const sh=shadow?`<feGaussianBlur in="SourceAlpha" stdDeviation="14" result="sb"/><feOffset in="sb" dx="6" dy="12" result="so"/><feFlood flood-color="${PAL.shadow}" flood-opacity=".2"/><feComposite in2="so" operator="in" result="shadow"/>`:"";
  return `<filter id="${id}" x="-40%" y="-40%" width="185%" height="195%" color-interpolation-filters="sRGB">${sh}
<feGaussianBlur in="SourceAlpha" stdDeviation="${blur}" result="bump"/>
<feDiffuseLighting in="bump" surfaceScale="${scale}" diffuseConstant="1.1" lighting-color="#ffffff" result="diff"><feDistantLight azimuth="225" elevation="66"/></feDiffuseLighting>
<feComposite in="diff" in2="SourceAlpha" operator="in" result="diffIn"/>
<feBlend in="SourceGraphic" in2="diffIn" mode="multiply" result="shaded"/>
<feSpecularLighting in="bump" surfaceScale="${scale}" specularConstant=".3" specularExponent="16" lighting-color="#eef4ff" result="spec"><feDistantLight azimuth="225" elevation="66"/></feSpecularLighting>
<feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
<feComposite in="shaded" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0" result="lit"/>
${shadow?`<feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>`:""}</filter>`;
}

<radialGradient id="${u}s" cx=".34" cy=".28" r=".78"><stop offset="0" stop-color="${P.s[0]}"/><stop offset=".2" stop-color="${P.s[1]}"/><stop offset=".62" stop-color="${P.s[2]}"/><stop offset="1" stop-color="${P.s[3]}"/></radialGradient>
<linearGradient id="${u}h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${P.h[0]}"/><stop offset=".5" stop-color="${P.h[1]}"/><stop offset="1" stop-color="${P.h[2]}"/></linearGradient>
${lightFilter(u+"p",8,4,true)}${lightFilter(u+"q",8,4,false)}${lightFilter(u+"v",3,2.5,true)}
<filter id="${u}d" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="11" result="b"/><feOffset in="b" dx="5" dy="10" result="o"/><feFlood flood-color="${P.shadow}" flood-opacity=".2"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="${u}f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>`}
function sphere(u,x,y,r){
  return `<g filter="url(#${u}d)"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="url(#${u}s)"/></g>`+
         `<ellipse cx="${(x-r*.32).toFixed(1)}" cy="${(y-r*.38).toFixed(1)}" rx="${(r*.28).toFixed(1)}" ry="${(r*.16).toFixed(1)}" fill="#fff" opacity=".5" filter="url(#${u}f)" transform="rotate(-30 ${(x-r*.32).toFixed(1)} ${(y-r*.38).toFixed(1)})"/>`;
}
const ART_SHAPES={
 /* 양끝이 가늘어지는 납작한 리본 띠 두 장 */
 band:(u,r)=>{
  const mk=(y0,amp,ph,wmax,fill,op)=>{const top=[],bot=[];
   for(let i=0;i<=10;i++){const t=i/10,x=10+t*310,y=y0+Math.sin(t*Math.PI*1.3+ph)*amp,w=3+wmax*Math.sin(t*Math.PI);top.push([x,y-w/2]);bot.unshift([x,y+w/2])}
   return `<path d="${smooth(top,false)}${smooth(bot,false).replace(/^M/,"L")}Z" fill="${fill}" opacity="${op}" filter="url(#${u}v)"/>`};
  return mk(140+r()*8,28,.5,34,`url(#${u}c)`,.85)+mk(108+r()*8,38,0,48,`url(#${u}h)`,1);
 },
 /* 구체를 감싸는 기울어진 궤도 고리 */
 orbit:(u,r)=>{
  const cx=196,cy=104,R=32+r()*4;
  const rings=[[-22,98,30,"a"],[30,86,26,"b"]];
  const arc=([rot,rx,ry,g],front)=>`<path d="M${cx-rx} ${cy}A${rx} ${ry} 0 0 ${front?0:1} ${cx+rx} ${cy}" transform="rotate(${rot} ${cx} ${cy})" fill="none" stroke="url(#${u}${g})" stroke-width="9" stroke-linecap="round" filter="url(#${u}v)"/>`;
  return rings.map(o=>arc(o,false)).join("")+sphere(u,cx,cy,R)+rings.map(o=>arc(o,true)).join("")+sphere(u,cx+88,cy+46,8);
 },
 /* 원근으로 눕힌 토러스를 겹겹이 쌓은 모양 */
 rings:(u,r)=>{
  let s="";const cx=200+r()*14;
  for(let i=0;i<4;i++){
   const cy=165-i*30,rx=86-i*12,ry=34-i*4,g=["c","b","b","a"][i];
   s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="url(#${u}${g})" stroke-width="${22-i*2}" filter="url(#${u}p)"/>`;
  }
  return s+sphere(u,cx,58,15);
 },
 /* 렌즈: 두꺼운 고리 + 구체 + 초점 모서리 */
 lens:(u,r)=>{
  const cx=192,cy=104;
  const br=(x,y,dx,dy)=>`<path d="M${x} ${y+dy*28}V${y}H${x+dx*28}" fill="none" stroke="url(#${u}a)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#${u}v)"/>`;
  return br(102,28,1,1)+br(282,28,-1,1)+br(102,180,1,-1)+br(282,180,-1,-1)+
   `<circle cx="${cx}" cy="${cy}" r="56" fill="none" stroke="url(#${u}b)" stroke-width="24" filter="url(#${u}p)"/>`+
   sphere(u,cx,cy,30);
 },
 /* 매끈한 조약돌 */
 blobs:(u,r)=>{
  const g=["c","b","a"];let s="";
  [[150,140,58],[222,96,52],[248,160,40]].forEach(([x,y,R],i)=>{
   const pts=[],n=6,off=r()*Math.PI;
   for(let k=0;k<n;k++){const a=k/n*Math.PI*2+off,rad=R*(.82+.28*r());pts.push([x+Math.cos(a)*rad*1.15,y+Math.sin(a)*rad*.85])}
   s+=`<path d="${smooth(pts,true)}" fill="url(#${u}${g[i]})" filter="url(#${u}p)"/>`;
  });
  return s;
 },
 /* 모서리가 둥근 큐브 계단 */
 blocks:(u,r)=>{
  const cube=(x,y,s)=>{const w=s*.87,h=s*.5;
   return `<g filter="url(#${u}v)"><polygon points="${x},${y-s} ${x+w},${y-h} ${x},${y} ${x-w},${y-h}" fill="url(#${u}t)"/>`+
          `<polygon points="${x-w},${y-h} ${x},${y} ${x},${y+s} ${x-w},${y+h}" fill="url(#${u}l)"/>`+
          `<polygon points="${x},${y} ${x+w},${y-h} ${x+w},${y+h} ${x},${y+s}" fill="url(#${u}r)"/></g>`};
  const s0=38+r()*4;
  return cube(250,82,s0)+cube(186,118,s0)+cube(122,154,s0)+sphere(u,252,170,14);
 },
 /* 둥근 기둥 막대그래프 */
 bars:(u,r)=>{
  const h=[.3,.55,.85,1,.75,.45];let s="";
  h.forEach((v,i)=>{const bh=(36+110*v)*(.92+.16*r()),x=78+i*36,y=184-bh;
   s+=`<rect x="${x}" y="${y.toFixed(1)}" width="26" height="${bh.toFixed(1)}" rx="13" fill="url(#${u}${i%2?"b":"a"})" filter="url(#${u}p)"/>`;});
  return s;
 },
 /* 두께가 있는 문서 판 */
 pages:(u,r)=>{
  let s="";
  [[-12,96,36,"c"],[-3,140,44,"b"],[8,184,50,"a"]].forEach(([rot,x,y,g])=>{
   const body=`<rect x="${x}" y="${y}" width="104" height="124" rx="16"`;
   s+=`<g transform="rotate(${rot} ${x+52} ${y+62})">`+
      `<g filter="url(#${u}d)">${body} transform="translate(5 7)" fill="${PAL.deep}"/>${body} fill="url(#${u}${g})"/></g>`+
      `<g filter="url(#${u}v)">`+[0,1,2,3].map(k=>`<rect x="${x+14}" y="${y+20+k*20}" width="${[66,50,74,40][k]}" height="8" rx="4" fill="#ffffff"/>`).join("")+`</g></g>`;
  });
  return s;
 },
 /* 튜브로 연결된 구체 네트워크 */
 network:(u,r)=>{
  const P=[[118,66],[192,40],[254,92],[172,116],[108,156],[222,166],[282,160]].map(([x,y])=>[x+r()*12-6,y+r()*10-5,13+r()*10]);
  const E=[[0,1],[1,2],[1,3],[0,3],[3,4],[3,5],[2,5],[5,6]];
  const tubes=E.map(([a,b])=>`<line x1="${P[a][0].toFixed(1)}" y1="${P[a][1].toFixed(1)}" x2="${P[b][0].toFixed(1)}" y2="${P[b][1].toFixed(1)}" stroke="url(#${u}c)" stroke-width="12" stroke-linecap="round"/>`).join("");
  return `<g filter="url(#${u}v)">${tubes}</g>`+P.map(([x,y,rad])=>sphere(u,x,y,rad)).join("");
 },
 /* 결정 트리: 구체 노드와 튜브 가지 */
 tree:(u,r)=>{
  const N=[[196,38,24],[140,98,20],[252,98,20],[110,160,16],[170,160,16],[222,160,16],[282,160,16]];
  N.forEach(n=>{n[0]+=r()*8-4;n[1]+=r()*6-3});
  const E=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
  const tubes=E.map(([a,b])=>`<line x1="${N[a][0].toFixed(1)}" y1="${N[a][1].toFixed(1)}" x2="${N[b][0].toFixed(1)}" y2="${N[b][1].toFixed(1)}" stroke="url(#${u}c)" stroke-width="11" stroke-linecap="round"/>`).join("");
  return `<g filter="url(#${u}v)">${tubes}</g>`+N.map(([x,y,rad])=>sphere(u,x,y,rad)).join("");
 },
 /* 두께가 있는 톱니바퀴 */
 gear:(u,r)=>{
  const cx=192,cy=100,R=82,rr=63,N=9,step=Math.PI*2/N,rot=r()*step;let d="";
  for(let i=0;i<N;i++){const a=rot+i*step;
   [[rr,0],[R,.16],[R,.46],[rr,.62]].forEach(([q,f],k)=>{const an=a+f*step;d+=(i===0&&k===0?"M":"L")+(cx+Math.cos(an)*q).toFixed(1)+" "+(cy+Math.sin(an)*q).toFixed(1)});
  }
  d+="Z"+`M${cx+28} ${cy}a28 28 0 1 0 -56 0a28 28 0 1 0 56 0Z`;
  let ext="";for(let k=10;k>=1;k--)ext+=`<path d="${d}" transform="translate(${(k*.8).toFixed(1)} ${(k*1.1).toFixed(1)})" fill="${k>5?PAL.deep:PAL.mid}" fill-rule="evenodd"/>`;
  return `<g filter="url(#${u}d)">${ext}</g><path d="${d}" fill="url(#${u}b)" fill-rule="evenodd" filter="url(#${u}q)"/>`;
 }
};
const ART_BY_TASK={"Tabular Prediction":["blocks","bars","tree","pages"],"Image Classification":["rings","blobs","lens"],"Object Detection":["lens","rings"],"Image Segmentation":["blobs","lens"],"Time-Series Forecasting":["band","orbit","bars","network"],"Probabilistic Decision-Making":["tree"],"Statistical Analysis":["bars","blocks"],"Text Classification":["pages"],"Retrieval & RAG":["network","pages","rings"],"OCR & Multimodal":["gear","orbit"]};
const ART_KIND=(()=>{const cnt={},out={};MODELS.forEach(m=>{const k=ART_BY_TASK[m.task]||["rings"];cnt[m.task]=cnt[m.task]||0;out[m.id]=k[cnt[m.task]%k.length];cnt[m.task]++});return out})();
function cardArt(m,forceKind){
  PAL=ART_PAL[ART_PAL_CTX[ctxOf(m)[0]]||"blue"];
  const seed=hashSeed(m.id),r=rng(seed),u="g"+seed.toString(36);
  const kind=forceKind||ART_KIND[m.id]||"rings";
  return `<svg viewBox="0 0 300 200" preserveAspectRatio="xMaxYMax meet" overflow="visible" aria-hidden="true" focusable="false">${artDefs(u)}${ART_SHAPES[kind](u,r)}</svg>`;
}

function renderModels(){
  const tasks=["All",...new Set(MODELS.map(m=>m.task))];
  const fams=["All",...new Set(MODELS.map(m=>m.family))];
  const list=MODELS.filter(m=>
    (state.task==="All"||m.task===state.task)&&(state.family==="All"||m.family===state.family)&&
    (state.ctx==="All"||ctxOf(m).includes(state.ctx))&&
    (!state.q||(m.name+m.task+m.oneLine+m.arch).toLowerCase().includes(state.q.toLowerCase())));
  app.innerHTML=header()+`
  <div class="filters">
    <input class="search" id="q" type="search" placeholder="Search by model, task, or architecture" value="${esc(state.q)}" aria-label="Search">
    <div class="row"><span class="label">Category</span>${["All","co","wt","gr"].map(k=>`<button class="chip" type="button" data-ctx="${k}" aria-pressed="${state.ctx===k}">${k==="All"?"All":CTX[k]}</button>`).join("")}</div>
    <div class="row"><span class="label">Task</span>${tasks.map(t=>`<button class="chip" type="button" data-task="${esc(t)}" aria-pressed="${state.task===t}">${esc(t)}</button>`).join("")}</div>
    <div class="row"><span class="label">Type</span>${fams.map(t=>`<button class="chip" type="button" data-fam="${esc(t)}" aria-pressed="${state.family===t}">${esc(t)}</button>`).join("")}</div>
  </div>
  ${list.length?`<div class="grid">${list.map(m=>`
    <button class="card" type="button" data-id="${m.id}" data-ctx="${ctxOf(m)[0]}">
      <div class="card-art" aria-hidden="true">${cardArt(m)}</div>
      <div class="badges">${ctxOf(m).map(ctxBadge).join("")}<span class="badge">${esc(m.family)}</span></div>
      <h2>${esc(m.name)}</h2>
      <p class="desc">${esc(m.oneLine)}</p>
      <div class="card-foot"><span class="pill">${esc(m.task)}</span><span class="go" aria-hidden="true">→</span></div>
    </button>`).join("")}</div>`
   :`<div class="empty">No models match the selected filters.</div>`}
  <p class="foot">카드를 누르면 모델 요약과 경험 카드가 열립니다. 회색 '작성 필요'는 아직 채우지 못한 항목입니다.</p>`;
  bindTheme(); bindTabs();
  const q=document.getElementById("q");
  q.oninput=e=>{state.q=e.target.value;const p=e.target.selectionStart;renderModels();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p);};
  app.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{state.task=b.dataset.task;renderModels();});
  app.querySelectorAll("[data-fam]").forEach(b=>b.onclick=()=>{state.family=b.dataset.fam;renderModels();});
  app.querySelectorAll("[data-ctx]").forEach(b=>b.onclick=()=>{state.ctx=b.dataset.ctx;renderModels();});
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;});
}

function renderProjects(){
  const groups=[["co","경력"],["wt","원티드 포텐업 하네스 엔지니어링 기반 AI agent 트랙"],["gr","연세대 공학대학원"]];
  app.innerHTML=header()+groups.map(([k,label])=>{
    const ps=PROJECTS.filter(p=>p.ctx===k);
    return `<section class="pgroup"><h2>${ctxBadge(k)} ${label}</h2><div class="plist">${ps.map(p=>{
      const ms=MODELS.filter(m=>m.usage.some(u=>u.p===p.id));
      return `<article class="proj">
        <div class="proj-body"><div class="pm">${esc(p.org)} · ${p.team?esc(p.team):'<span class="todo">개인/팀 · 인원 작성 필요</span>'} · ${esc(p.period)}</div><h3>${esc(p.name)}</h3>
        <p>${esc(p.summary)}</p>
        <div class="ptags">${ms.map(m=>`<button class="pill pill-btn" type="button" data-id="${m.id}">${esc(m.name)}</button>`).join("")}</div></div></article>`;}).join("")}</div></section>`;
  }).join("")+`<p class="foot">모델 이름을 누르면 해당 모델의 상세 기록으로 이동합니다.</p>`;
  bindTheme(); bindTabs();
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;});
}

function renderDetail(m){
  const list=a=>a&&a.length?`<ul class="plain">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="todo">작성 필요</span>';
  const lineage=m.lineage?.length?`<section class="sec"><h2>계통과 관련 모델</h2><div class="tags">${m.lineage.map(l=>
    l.id&&byId[l.id]?`<button class="tag" type="button" data-go="${l.id}">${esc(l.name)} <small>${esc(l.rel)}</small></button>`
             :`<span class="tag">${esc(l.name)} <small>${esc(l.rel)}</small></span>`).join("")}</div></section>`:"";
  const usage=m.usage.map(u=>{
    const p=projById[u.p];
    const rows=[["역할",u.role],["선택 이유",u.why],["데이터",u.data],["주요 설정",u.setup]];
    const rows2=[["배운 점",u.learned],["오류·실패 사례",u.qual],["환경·재현",u.env],["링크",u.links]];
    const mc=u.metrics&&u.metrics.length?`<div class="mchips">${u.metrics.map(([k,v])=>`<span class="mchip"><small>${esc(k)}</small><b>${esc(v)}</b></span>`).join("")}</div>`:'<span class="todo">작성 필요</span>';
    const dl=r=>r.map(([k,v])=>`<dt>${k}</dt><dd>${val(v)}</dd>`).join("");
    return `<article class="rec">
      <div class="rec-head"><h3><button type="button" data-proj="${p.id}">${esc(p.name)}</button></h3>
        <span class="mono" style="font-size:14px;color:var(--muted)">${ctxBadge(p.ctx)} ${esc(u.when)}</span></div>
      <dl>${dl(rows)}<dt>결과</dt><dd>${mc}</dd>${dl(rows2)}</dl></article>`;}).join("");
  app.innerHTML=`
  ${themeBtn()}
  <button class="back" type="button" id="back">← 전체 모델</button>
  <header class="dhero" data-ctx="${ctxOf(m)[0]}">
    <div class="dhero-art" aria-hidden="true">${cardArt(m)}</div>
    <div class="badges">${ctxOf(m).map(ctxBadge).join("")}<span class="badge">${esc(m.family)}</span><span class="badge">${esc(m.task)}</span></div>
    <h1>${esc(m.name)}</h1><p class="sub">${esc(m.oneLine)}</p>
  </header>
  <dl class="facts">
    <div><dt class="label">출처</dt><dd>${esc(m.source.org)}</dd></div>
    <div><dt class="label">논문</dt><dd>${m.source.paper?esc(m.source.paper):"–"}</dd></div>
    <div><dt class="label">구분</dt><dd>${esc(m.family)} · ${esc(m.arch)}</dd></div>
    <div><dt class="label">학습 방식 / 연도</dt><dd>${esc(m.learn)} · ${m.year||"–"}</dd></div>
  </dl>
  <section class="sec"><h2>모델 요약</h2><p class="hint">모델 자체에 대한 일반적인 설명입니다.</p>
    <p style="margin:0 0 20px"><b>목적.</b> ${esc(m.purpose)}</p>
    <div class="two"><div><h3>특징</h3>${list(m.features)}</div><div><h3>한계</h3>${list(m.limits)}</div></div>
  </section>
  ${lineage}
  ${m.io?`<section class="sec"><h2>입력과 출력</h2><div class="two"><div><h3>Input</h3><p style="margin:0">${esc(m.io.input)}</p></div><div><h3>Output</h3><p style="margin:0">${esc(m.io.output)}</p></div></div></section>`:""}
  ${m.code?`<section class="sec"><h2>예측 및 추출 과정</h2><pre><code>${esc(m.code)}</code></pre></section>`:""}
  ${m.train?`<section class="sec"><h2>${esc(m.trainTitle||"학습 과정")}</h2><ol class="steps">${m.train.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol></section>`:""}
  ${m.metrics?`<section class="sec"><h2>성능 평가 지표</h2><div class="table-wrap"><table><thead><tr><th>지표</th><th>의미</th></tr></thead><tbody>${m.metrics.map(x=>`<tr><td class="mono">${esc(x.k)}</td><td>${esc(x.v)}</td></tr>`).join("")}</tbody></table></div></section>`:""}
  ${m.apps?`<section class="sec"><h2>활용 예시</h2><div class="table-wrap"><table><thead><tr><th>분야</th><th>활용</th></tr></thead><tbody>${m.apps.map(x=>`<tr><td>${esc(x.f)}</td><td>${esc(x.t)}</td></tr>`).join("")}</tbody></table></div></section>`:""}
  <section class="sec bare"><h2>경험 카드</h2><p class="hint">직접 사용하며 겪은 내용입니다. 위의 모델 요약은 일반적인 설명입니다.</p><div class="log">${usage}</div></section>`;
  bindTheme();
  document.getElementById("back").onclick=()=>{location.hash="";};
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.go;});
  app.querySelectorAll("[data-proj]").forEach(b=>b.onclick=()=>{state.tab="projects";location.hash="";route();});
}

function route(){
  const _id=location.hash.slice(1);app.classList.toggle("narrow",!!byId[_id]||state.tab==="projects");
  const id=location.hash.slice(1);
  if(byId[id]) renderDetail(byId[id]);
  else if(state.tab==="projects") renderProjects();
  else renderModels();
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
route();
</script>
